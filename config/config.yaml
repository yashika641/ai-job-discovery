# AI Job Discovery Automation — configuration
# Everything the pipeline does is driven from this file. Secrets (SMTP
# credentials) are NOT stored here — see .env.example.

profile:
  # Jobs whose description asks for at most this many years of experience
  # are ranked favorably; jobs asking for more score lower. Jobs that don't
  # mention YOE at all are scored neutrally either way.
  max_years_experience: 3
  preferred_countries:
    - India
    - Remote
    - Global remote
  remote_preference: strong           # strong | soft | none
  preferred_keywords:                 # tech-stack overlap boosts rank score
    - python
    - llm
    - genai
    - generative ai
    - langchain
    - langgraph
    - rag
    - retrieval augmented generation
    - vector database
    - pinecone
    - weaviate
    - faiss
    - pytorch
    - tensorflow
    - openai
    - anthropic
    - claude
    - gpt
    - prompt engineering
    - fine-tuning
    - transformers
    - huggingface
    - mlops
    - agentic
    - ai agent

roles:
  include:
    - Applied AI Engineer
    - AI Engineer
    - GenAI Engineer
    - LLM Engineer
    - Machine Learning Engineer
    - AI Platform Engineer
    - AI Infrastructure Engineer
    - AI Automation Engineer
    - AI Backend Engineer
    - ML Engineer
  # Titles containing these words are hard-excluded even if they also match
  # an include term above (e.g. "Senior Frontend / AI Engineer").
  exclude_keywords:
    - frontend
    - front-end
    - marketing
    - recruiter
    - human resources
    - " hr "
    - sales
    - account executive
    - finance
    - accounting
    - customer success
    - customer support
    - qa engineer
    - quality assurance
    - test engineer
    - product manager
    - program manager
  include_internships: false
  internship_keywords:
    - intern
    - internship
    - co-op
    - trainee

sources:
  companies_csv: data/companies.csv
  rss:
    - name: weworkremotely
      url: https://weworkremotely.com/categories/remote-programming-jobs.rss
  apis:
    remoteok: https://remoteok.com/api
    himalayas: https://himalayas.app/jobs/api/search
    jobicy: https://jobicy.com/api/v2/remote-jobs

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 2
  concurrency: 10
  rate_limit_per_host_seconds: 1.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

schedule:
  cron: "30 3 * * *"   # 09:00 IST daily

email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  sender_env_var: EMAIL_SENDER
  password_env_var: EMAIL_APP_PASSWORD
  recipient: palyashika641@gmail.com
  top_n_in_email: 20
  min_stars_in_email: 3
  worth_looking_at_limit: 30   # cap on the collapsible "other jobs" section

limits:
  max_jobs_per_company: 5   # never show/store more than this many openings from one company per run

storage:
  db_path: data/jobscraper.db

report:
  output_dir: reports

logging:
  level: INFO
  file: logs/jobscraper.log
