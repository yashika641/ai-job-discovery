# AI Job Discovery Automation — configuration
# Everything the pipeline does is driven from this file. Secrets (SMTP
# credentials) are NOT stored here — see .env.example.

profile:
  # Jobs whose description asks for at most this many years of experience
  # are ranked favorably; jobs asking for more score lower on a gradient
  # (never excluded outright). Jobs that don't mention YOE at all are
  # scored neutrally either way.
  max_years_experience: 3
  # Hard cutoff: jobs asking for more than this many years are dropped
  # entirely before Gemini extraction even runs (see
  # pipeline._within_experience_cap). Jobs that don't mention YOE at all
  # always pass.
  max_years_experience_hard_limit: 5
  preferred_countries:
    - India
    - Remote
    - Global remote
  remote_preference: strong           # strong | soft | none
  # A job must overlap on at least this many of the keywords below (after
  # skill matching — see gemini.enabled) to pass — the sole relevance gate.
  # Title/role name is never used to include or exclude a job.
  min_skill_matches: 1
  # On-site/hybrid jobs based in one of these cities qualify even when not
  # remote (checked before Gemini extraction runs, to bound API usage).
  onsite_hub_cities:
    - Gurgaon
    - Gurugram
    - Noida
  preferred_keywords:                 # candidate's actual skill set — matched against each JD's Gemini-extracted (or, as fallback, plain-scanned) keywords
    - python
    - llm
    - genai
    - generative ai
    - langchain
    - langgraph
    - rag
    - retrieval augmented generation
    - vector database
    - pinecone
    - weaviate
    - faiss
    - pytorch
    - tensorflow
    - openai
    - anthropic
    - claude
    - gpt
    - prompt engineering
    - fine-tuning
    - transformers
    - huggingface
    - mlops
    - agentic
    - ai agent

gemini:
  # Extracts each new job's actual required skills (ranked by importance)
  # from its JD text via the Gemini API, so scoring matches against your
  # real skill set instead of only a fixed keyword scan (see
  # gemini_extractor.py). Only runs on jobs that already passed the
  # experience and location filters above, and only on brand-new postings —
  # set enabled: false (or leave GEMINI_API_KEY unset) to fall back to a
  # plain substring scan everywhere.
  enabled: true
  api_key_env_var: GEMINI_API_KEY
  # Google retires Gemini model IDs on a rolling basis (gemini-2.0-flash was
  # shut down June 2026) -- if extraction starts logging 404 NOT_FOUND
  # errors again, check https://ai.google.dev/gemini-api/docs/models for
  # the current model lineup and update this.
  model: gemini-3.5-flash
  batch_size: 10   # job descriptions bundled into a single API request

roles:
  # Search-time discovery keywords only (generic HTML career-page link-text
  # matching, Himalayas query) plus a title-match scoring bonus in
  # ranking.py. NOT a relevance filter — a job's title never determines
  # whether it's kept; only skill overlap (see profile.min_skill_matches)
  # does. Broad on purpose so title variants like SDE/FDE aren't missed at
  # the scrape stage.
  include:
    - Applied AI Engineer
    - AI Engineer
    - GenAI Engineer
    - LLM Engineer
    - Machine Learning Engineer
    - AI Platform Engineer
    - AI Infrastructure Engineer
    - AI Automation Engineer
    - AI Backend Engineer
    - ML Engineer
    - Software Engineer
    - Software Development Engineer
    - SDE
    - SDE-1
    - SDE-2
    - SDE I
    - SDE II
    - Forward Deployed Engineer
    - FDE
    - AI Software Engineer
    - Artificial Intelligence Engineer
    - Applied Scientist
    - AI Research Engineer
    - Backend Engineer
    - Full Stack Engineer
  # Titles containing these words are hard-excluded (matched as whole
  # words/phrases via text_match.contains_term, so "hr" won't false-match
  # inside e.g. "Chris" and "sales" won't false-match inside "Salesforce").
  exclude_keywords:
    - frontend
    - front-end
    - marketing
    - recruiter
    - human resources
    - hr
    - sales
    - account executive
    - finance
    - accounting
    - customer success
    - customer support
    - qa engineer
    - quality assurance
    - test engineer
    - product manager
    - program manager
  include_internships: false
  internship_keywords:
    - intern
    - internship
    - co-op
    - trainee

sources:
  companies_csv: data/companies.csv
  rss:
    - name: weworkremotely
      url: https://weworkremotely.com/categories/remote-programming-jobs.rss
  apis:
    remoteok: https://remoteok.com/api
    himalayas: https://himalayas.app/jobs/api/search
    jobicy: https://jobicy.com/api/v2/remote-jobs

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 2
  concurrency: 10
  rate_limit_per_host_seconds: 1.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

schedule:
  cron: "30 3 * * *"   # 09:00 IST daily

email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  sender_env_var: EMAIL_SENDER
  password_env_var: EMAIL_APP_PASSWORD
  recipient: palyashika641@gmail.com
  # Jobs scoring at/above this land in "Top Recommendations"; every other
  # new job that passed the skills filter is still listed in full, ranked
  # by score, under "Other jobs worth looking at" — no count caps.
  min_score_for_recommendation: 70.0

limits:
  max_jobs_per_company: 5   # never show/store more than this many openings from one company per run

storage:
  db_path: data/jobscraper.db

report:
  output_dir: reports

logging:
  level: INFO
  file: logs/jobscraper.log
